name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ponke
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: ponke_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ponke -d ponke_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DATABASE_URL: postgresql+asyncpg://ponke:test-only@localhost:5432/ponke_test
      TEST_DATABASE_URL: postgresql+asyncpg://ponke:test-only@localhost:5432/ponke_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements-dev.lock
      - run: pip install --no-deps -e .
      - run: ruff check .
      - run: ruff format --check .
      - run: alembic upgrade head
      - run: alembic check
      - run: pytest -q
      - run: docker build -t ponke:ci .
