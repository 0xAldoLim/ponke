[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ponke"
version = "0.1.0"
description = "A private Telegram chief of staff"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "python-telegram-bot>=22,<23",
  "openai>=2,<3", "sqlalchemy[asyncio]>=2.0.36,<3", "asyncpg>=0.30,<1",
  "alembic>=1.14,<2", "pydantic-settings>=2.7,<3", "httpx>=0.28,<1",
  "cryptography>=44", "python-dateutil>=2.9,<3", "tzdata>=2025.1",
  "apscheduler>=3.11,<4", "pillow>=11,<13", "openpyxl>=3.1,<4",
  "structlog>=25,<27"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "aiosqlite>=0.21,<1", "ruff>=0.11,<1", "respx>=0.22,<1"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
